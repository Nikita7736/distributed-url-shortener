events {}

http {
  upstream url_shortner_upstream {
    server app1:8080;
    server app2:8080;
  }

  server {
    listen 80;

    location / {
      # Preserve original Host header including port (e.g. localhost:8080)
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://url_shortner_upstream;
    }
  }
}

